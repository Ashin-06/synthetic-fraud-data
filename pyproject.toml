[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-fraud-data"
version = "1.0.0"
description = "Differentially private synthetic fraud data: copula and TVAE synthesizers, an evaluation scorecard and a sampling API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "joblib>=1.3",
    "plotly>=5.18",  # the benchmark report
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
realdata = ["pyarrow>=15"]
dashboard = ["streamlit>=1.40"]

[project.scripts]
synthfraud = "synthfraud.__main__:main"

[tool.setuptools]
packages = ["synthfraud"]

[tool.setuptools.package-data]
synthfraud = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["synthfraud"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]  # Depends() defaults are FastAPI's idiom; zip(strict=) is style
