name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: bandit -q -r synthfraud -ll
      # torch is pinned as 2.x+cpu (PyTorch's CPU index); audit the same upstream release
      - run: sed "s/+cpu//" requirements.lock > audit.txt && pip-audit -r audit.txt --no-deps --disable-pip --progress-spinner off
      - run: pytest -q --cov --cov-report=term-missing:skip-covered
      - if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
